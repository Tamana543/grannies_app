# Put this file in your project at: .github/workflows/build-apk.yml
# It builds the release APK on GitHub's servers, so your PC needs no Android SDK.

name: Build APK

on:
  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # EDIT THIS: run `flutter --version` on your PC and use the same
          # version number and channel (stable, beta or master).
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      # The BDApps keys are read from GitHub Secrets (Settings > Secrets and
      # variables > Actions). If you have not added them, the build still works
      # but the SOS feature will say it is not configured.
      - run: >
          flutter build apk --release
          --dart-define=BDAPPS_APPLICATION_ID=${{ secrets.BDAPPS_APPLICATION_ID }}
          --dart-define=BDAPPS_PASSWORD=${{ secrets.BDAPPS_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: grannies-healthbar-apk
          path: build/app/outputs/flutter-apk/app-release.apk
