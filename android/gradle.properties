# Keep native/JVM overhead bounded on machines with limited available RAM.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# Flutter still requires the legacy AGP DSL; Kotlin is provided by AGP 9.
android.newDsl=false
android.builtInKotlin=true
